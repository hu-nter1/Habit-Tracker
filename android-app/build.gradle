plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.personal.studytracker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.personal.studytracker'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        debug {
            storeFile file("${System.getProperty('user.home')}/.android/study-tracker-debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
}
